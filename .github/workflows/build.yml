name: Build map data

on:
  workflow_dispatch:            # кнопка «Run workflow» во вкладке Actions
  schedule:
    - cron: "17 3 3 * *"        # сам раз в месяц: 3-го числа в 03:17 UTC

permissions:
  contents: write               # чтобы выкладывать готовые файлы в Releases

jobs:
  italy:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y osmium-tool
          pip install "osmium>=4.0,<5" "shapely>=2.0" numpy

      - name: Download Italy from Geofabrik
        run: curl -L --fail --retry 3 -o italy.osm.pbf https://download.geofabrik.de/europe/italy-latest.osm.pbf

      - name: Keep only roads and boundaries
        run: osmium tags-filter italy.osm.pbf w/highway r/boundary=administrative -o filtered.osm.pbf

      - name: Build files for the app
        run: python3 build_country.py filtered.osm.pbf out IT

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view italy > /dev/null 2>&1 || \
            gh release create italy --title "Italy" --notes "Street data for viision. © OpenStreetMap contributors, ODbL."
          gh release upload italy out/* --clobber
          gh release edit italy --title "Italy $(date -u +%Y-%m-%d)"
